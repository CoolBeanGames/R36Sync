name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: R36Sync-Windows-x64.zip
            platform: windows
          - os: ubuntu-latest
            artifact_name: R36Sync-Linux-x64.zip
            platform: linux
          - os: macos-latest
            artifact_name: R36Sync-macOS.zip
            platform: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev aria2 zip

      - name: Install System Dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install aria2 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name R36Sync `
            --add-data "r36sync.db;." `
            --add-data "bin;bin" `
            --collect-all customtkinter `
            main.py
          Compress-Archive -Path dist/R36Sync -DestinationPath ${{ matrix.artifact_name }}

      - name: Build Executable (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name R36Sync \
            --add-data "r36sync.db:." \
            --collect-all customtkinter \
            main.py
          cd dist && zip -r ../${{ matrix.artifact_name }} R36Sync

      - name: Build Executable (macOS)
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name R36Sync \
            --add-data "r36sync.db:." \
            --collect-all customtkinter \
            main.py
          cd dist
          if [ -d "R36Sync.app" ]; then
            zip -r ../${{ matrix.artifact_name }} R36Sync.app
          else
            zip -r ../${{ matrix.artifact_name }} R36Sync
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: R36Sync-Windows-x64.zip
          path: ./release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: R36Sync-Linux-x64.zip
          path: ./release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: R36Sync-macOS.zip
          path: ./release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: R36Sync ${{ steps.tag.outputs.RELEASE_TAG }}
          body: |
            ## R36Sync Standalone Release (${{ steps.tag.outputs.RELEASE_TAG }})

            Zero Python setup required! Download and unzip the executable bundle for your operating system:

            - **Windows**: `R36Sync-Windows-x64.zip` — Unzip and double-click `R36Sync.exe`
            - **macOS**: `R36Sync-macOS.zip` — Unzip and run `R36Sync.app`
            - **Linux**: `R36Sync-Linux-x64.zip` — Unzip and execute `./R36Sync/R36Sync`

            ### Features Included
            - 🎮 Full 22+ Retro Console Catalog with instant Minerva Archive search
            - 🔍 Unified Browse & Search tab with live catalog filtering
            - ⬇ 1-Click ROM downloading with automatic `.zip` extraction & clean deletion
            - 💿 Multi-disc `.m3u` / `.m3a` automated playlist creator and live disk watcher
            - 🔁 Seamless R36S ArkOS SD Card synchronization and save game backup engine
            - 🖼 Libretro high-res box art auto-fetcher
          files: |
            release-assets/R36Sync-Windows-x64.zip
            release-assets/R36Sync-Linux-x64.zip
            release-assets/R36Sync-macOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
